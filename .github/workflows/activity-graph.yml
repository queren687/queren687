name: Generate Activity Graph

on:
  schedule:
    # Runs automatically every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          username: queren687
          output: dist/activity-graph.svg
          bg_color: '1a1b26'
          color: 'ff79c6'
          line: 'ff79c6'
          point: 'ff9e64'
          area: true
          hide_border: true

      - name: Deploy SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
